name: Refresh NSE index data

on:
  schedule:
    - cron: '0 3 1,16 * *'    # the 1st & 16th of each month (~every 15 days), 03:00 UTC (08:30 IST)
  workflow_dispatch: {}       # lets you run it manually from the Actions tab anytime

permissions:
  contents: write             # allow the action to commit the refreshed files back

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r build/requirements.txt

      - name: Fetch latest data and rebuild the app
        run: |
          python build/refresh_data.py
          python build/make_excel.py

      - name: Commit and push if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html NSE_Index_Data_Price_TRI.xlsx build/data_snapshots/latest.json
          if git diff --staged --quiet; then
            echo "No data changes - nothing to commit."
          else
            git commit -m "Auto-refresh NSE index data ($(date -u +%Y-%m-%d))"
            git push
          fi
